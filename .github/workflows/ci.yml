name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # CI-only throwaway values, not used anywhere real - locally this comes from
      # `dotnet user-secrets` (see MEMORY.md), which obviously isn't available on a
      # fresh runner. No production deployment exists yet; when one does, it must get
      # its own real signing key from that environment's secret store, never this one.
      Jwt__SigningKey: "0f7158d3b3d1fd20813a5840faaf1ed5d5d3ff3b7e7a6b4cf8c7fa08e3be3082"
      Jwt__Issuer: "walletledger-ci"
      Jwt__Audience: "walletledger-ci-client"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WalletLedger.slnx

      - name: Build
        run: dotnet build WalletLedger.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test WalletLedger.slnx --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # CI-only throwaway values - locally these come from `dotnet user-secrets` (see
      # MEMORY.md), which obviously isn't available on a fresh runner. No production
      # deployment exists yet; when one does, it must get its own real signing key from
      # that environment's secret store, never this one. Kept as a repo secret (not a
      # literal here) purely to keep it out of gitleaks' way, not because it's sensitive.
      Jwt__SigningKey: ${{ secrets.CI_JWT_SIGNING_KEY }}
      Jwt__Issuer: "walletledger-ci"
      Jwt__Audience: "walletledger-ci-client"
      # WalletLedgerApiFactory (tests/WalletLedger.IntegrationTests) always overrides this
      # with a real Testcontainers Postgres connection string before any test touches the
      # database (AddDbContext's later call wins) - but Program.cs's own top-level
      # AddDbContext call still runs first and throws on a null connection string before
      # the test's override ever gets a chance to apply. This value is never actually
      # connected to; it only has to be non-null and syntactically valid.
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=ci_unused;Username=ci_unused;Password=ci_unused"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WalletLedger.slnx

      - name: Build
        run: dotnet build WalletLedger.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test WalletLedger.slnx --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

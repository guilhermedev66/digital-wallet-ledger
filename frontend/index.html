<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Pre-hydration theme resolve: runs before first paint so an explicit
      // stored choice applies immediately instead of flashing the
      // prefers-color-scheme default and then flipping once React mounts.
      // Kept in sync with the STORAGE_KEY in src/hooks/useTheme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('wallet-ledger-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (e) {
          /* localStorage unavailable (private mode, disabled) - fall back to prefers-color-scheme */
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Digital Wallet & Ledger — a double-entry ledger wallet simulator. No real money, no real banks."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Digital Wallet &amp; Ledger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

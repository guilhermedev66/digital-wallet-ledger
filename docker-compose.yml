services:
  postgres:
    image: postgres:16-alpine
    container_name: walletledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: walletledger
      POSTGRES_PASSWORD: walletledger_dev_only
      POSTGRES_DB: walletledger
    ports:
      - "5432:5432"
    volumes:
      - walletledger-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletledger -d walletledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  walletledger-postgres-data:
